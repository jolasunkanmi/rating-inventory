<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="./favicon-32x32.png" type="image/x-icon">
  <title>Rating Component</title>
</head>
<body>
  <main class="desktop-design">
    <div class="rating-box">
      <div class="icon">
        <div class="icon-star"></div>
      </div>
      
      <h1 class="title">How did we do?</h1>
      
      <p class="paragraph">Please let us know how we did with your support request. All feedback is appreciated to help us improve our offering!</p>
      
      <div class="button-rate">
        <button class="button">1</button>
        <button class="button">2</button>
        <button class="button">3</button>
        <button class="button">4</button>
        <button class="button">5</button>
      </div>
      
      <div class="button-submit">
        <button id="submit">SUBMIT</button>
      </div>
    </div>
    <div class="thankyou-box">
        <div class="thankyou-icon"><img src="./illustration-thank-you.svg" alt="Image of a kind of cash register"></div>
        <div id="result-panel"></div>
        <h1>Thank you!</h1>
        <p>We appreciate you taking the time to give a rating. If you ever need more support, don't hesitate to get in touch!</p>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
